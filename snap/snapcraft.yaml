      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstfft-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstnet-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstphotography-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstriff-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstrtsp-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstsdp-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstva-1.0.so.0.2802.0
