      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLdispatch.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstbasecamerabinsrc-1.0.so.0.2802.0
