name: image-builder
base: core26
version: '1.0.0'
summary: A GUI frontend to the "ubuntu-image snap" command
title: Ubuntu Core Image Builder
description: |
  Build Ubuntu Core images with a GUI tool.

  Handle additional snaps, system-user assertions and validation sets easily.
  Preseed images for faster initial boot, manage image sizes for VM-targeting images
  or inject disk/info files with build information data.

contact: https://github.com/ogra1/image-builder/issues
license: GPL-2.0-only
issues: https://github.com/ogra1/image-builder/issues
source-code: https://github.com/ogra1/image-builder
website: https://github.com/ogra1/image-builder

grade: stable
confinement: classic

lint:
  ignore:
    - classic:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri/libdril_dri.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libffi.so.8.1.4
