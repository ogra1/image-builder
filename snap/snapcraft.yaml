      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstapp-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstcodecparsers-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgstrtp-1.0.so.0.2802.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libva-drm.so.2.2300.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libva.so.2.2300.0

apps:
  image-builder:
    command: bin/ubuntu_image_gui
    command-chain: [bin/launcher]
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/bin/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      LIBGL_DRIVERS_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      GTK_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0
      GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
      GTK_USE_PORTAL: 0

parts:
  flutter-git:
    plugin: nil
    source: .
    source-type: git
    override-pull: |
      # necessary when reruns using the same container
      if [ -d "flutter" ]; then
        rm -rf "flutter"
      fi

      craftctl default

      FLUTTER_VERSION=3.47.6
      git clone -b ${FLUTTER_VERSION} --depth 1 https://github.com/flutter/flutter.git
    override-build: |
      if [ $CRAFT_ARCH_BUILD_FOR = riscv64 ]; then
        export FLUTTER_STORAGE_BASE_URL=https://flutter-experimental.ubuntu.com
      fi

      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      cp -r $CRAFT_PART_SRC/flutter $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $CRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
    override-prime: ""
  image-builder:
    after: [flutter-git]
    plugin: nil
    source: .
    build-attributes: [enable-patchelf]
    override-build: |
      set -eux
      mkdir -p $CRAFT_PART_INSTALL/bin
      git submodule update --init --recursive

      flutter pub get
      flutter build linux --release -v
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
  libraries:
    plugin: nil
    build-attributes: [enable-patchelf]
    stage-packages:
      - libatk1.0-0t64
      - libcairo-gobject2
      - libcairo2
      - libegl-mesa0
      - libegl1
      # Needed for the dri drivers see https://github.com/canonical/ubuntu-desktop-installer/issues/2391
      - libelf1t64
      - libgl1
      - libgles2
      - libglib2.0-0t64
      - libglib2.0-dev
      - libgirepository-1.0-1
      - libgtk-3-0t64
      - libjpeg-turbo8
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpng16-16t64
      - librsvg2-common
      - libwayland-egl1
      - libx11-6
      - libdatrie1
      - libdrm2
      - libgbm1
      - libglapi-mesa
      - libgraphite2-3
      - libxshmfence1
      - libpciaccess0
      - libvulkan1
      - shared-mime-info
      - libglib2.0-bin
      - libibus-1.0-5
      - python3-gi
      - zenity
    stage:
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgdk_pixbuf-2.0.so.0
        #      - usr/lib/*/libEGL*.so.*
        #      - usr/lib/*/libGL*.so.*
        #      - usr/lib/*/libX*.so.*
        #      - usr/lib/*/liba*.so.*
        #      - usr/lib/*/libcairo*.so.*
        #      - usr/lib/*/libe*.so.*
        #      - usr/lib/*/libf*.so.*
        #      - usr/lib/*/libg*.so.*
        #      - usr/lib/*/libharfbuzz*.so.*
        #      - usr/lib/*/libibus*.so.*
        #      - usr/lib/*/libpango*.so.*
        #      - usr/lib/*/libpixman*.so.*
        #      - usr/lib/*/libpng*.so.*
        #      - usr/lib/*/libthai*.so.*
        #      - usr/lib/*/libwayland*.so.*
        #      - usr/lib/*/libxcb*.so.*
        #      - usr/lib/*/libxkb*.so.*
        #      - usr/lib/*/libdatrie*.so.*
        #      - usr/lib/*/libdrm*.so.*
        #      - usr/lib/*/libgbm*.so.*
        #      - usr/lib/*/libglapi*.so.*
        #      - usr/lib/*/libgraphite2*.so.*
        #      - usr/lib/*/libxshmfence*.so.*
        #      - usr/lib/*/libpciaccess*.so.*
        #      - usr/lib/*/libsensors*.so.*
        #      - usr/lib/*/libvulkan*.so.*
        #      - usr/lib/python3/dist-packages/gi
        #      - usr/share/glvnd/egl_vendor.d
        #      - usr/lib/*/
        #      - usr/bin/update-mime-database
        #      - usr/bin/g*
        #      - usr/share/mime
        #      - -usr/lib/*/pkgconfig
        #      - -usr/lib/pkgconfig
        #      - -usr/share/pkgconfig
        #      - -usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libgallium*
  legacy-loaders-provider:
    after: [libraries]
    plugin: meson
    source: https://gitlab.gnome.org/GNOME/gdk-pixbuf.git
    source-tag: '2.42.10'
    build-attributes: [enable-patchelf]
    meson-parameters:
      - -Dbuiltin_loaders=none
      - -Dgio_sniffing=false
      - -Dgtk_doc=false
      - -Dman=false
      - --prefix=/usr
    build-packages:
      - meson
      - libpng-dev
      - libjpeg-dev
      - shared-mime-info
      - patchelf
      - pkg-config
    override-prime: |
      craftctl default

      # patchelf
      BASE=core26

      RPATH="\$ORIGIN/../../..:/snap/$BASE/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"

      for file in $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders/*; do
        patchelf --force-rpath --set-rpath $RPATH $file
      done
      RPATH="\$ORIGIN:/snap/$BASE/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      patchelf --force-rpath --set-rpath $RPATH $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgdk_pixbuf-2.0.so.0.4200.10

      # init loader cache
      mkdir -p $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/
      $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders > $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache
      sed -i "s|$CRAFT_PRIME||g" $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache
    stage:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders/*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgdk_pixbuf-2.0*
  dri-no-patchelf:
    after: [libraries]
    plugin: nil
    stage-packages:
      - libgl1-mesa-dri
    build-attributes:
      - no-patchelf # Otherwise snapcraft may strip the build ID and cause the driver to crash
    stage:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      - usr/share/drirc.d
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium*
  launcher:
    plugin: nil
    source: .
    source-type: git
    build-attributes: [enable-patchelf]
    override-build: |
      set -eux
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp $CRAFT_PROJECT_DIR/snap/local/launcher $CRAFT_PART_INSTALL/bin/
