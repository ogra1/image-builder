      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgdk_pixbuf-2.0.so.0.4400.5
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgirepository-1.0.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libglapi.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgthread-2.0.so.0.8800.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libhwy_contrib.so.1.3.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libhwy_test.so.1.3.0
